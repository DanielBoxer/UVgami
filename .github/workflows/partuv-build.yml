name: PartUV build

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      built:
        value: ${{ jobs.prepare.outputs.built }}

permissions:
  contents: write

env:
  # every arch cuda 13 supports
  CUDAARCHS: "75-real;80-real;86-real;89-real;90-real;120"
  # source of the bundled windows openmp runtime
  LLVM_VERSION: "22.1.8"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.release.outputs.built }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check component release
        id: release
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' engine/partuv/pyproject.toml | sed -E 's/version *= *"(.*)"/\1/')
          INSTALL_VERSION=$(grep -m1 '^PARTUV_VERSION' src/engines/partuv/install.py | sed -E 's/PARTUV_VERSION *= *"(.*)"/\1/')
          if [ "$VERSION" != "$INSTALL_VERSION" ]; then
            echo "::error::PartUV version $VERSION does not match install.py version $INSTALL_VERSION."
            exit 1
          fi

          TAG="partuv-v$VERSION"
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
            if ! git diff --quiet "$TAG" HEAD -- engine/partuv; then
              echo "::error::PartUV changed since $TAG. Bump engine/partuv/pyproject.toml and PARTUV_VERSION."
              exit 1
            fi
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.built == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        # the addon runs partuv in its own 3.11 venv, not blender's python
        python: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: "13.2.0"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcgal-dev libyaml-cpp-dev libtbb-dev

      # ninja needs cl.exe on PATH
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Point vcpkg at a cacheable binary dir
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg-cache" >> $GITHUB_ENV
          mkdir -p vcpkg-cache

      # the runner image's vcpkg tool and tree can lag the pinned builtin-baseline
      - name: Sync vcpkg to pinned baseline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = (Get-Content engine/partuv/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_INSTALLATION_ROOT fetch origin
          git -C $env:VCPKG_INSTALLATION_ROOT checkout $baseline
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat"

      # first uncached run compiles cgal and friends, about an hour
      - name: Cache vcpkg binaries
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/partuv/vcpkg.json') }}
          # the version bump that triggers this workflow also changes the hash
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Build wheel
        run: uv build -p ${{ matrix.python }} --wheel engine/partuv -o dist

      # cudart stays bundled, the geometric tier has no torch to supply it
      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        run: |
          # ubuntu 22.04's apt patchelf is too old for auditwheel
          uvx --with patchelf auditwheel repair dist/*.whl -w wheelhouse \
            --exclude libcublas.so.12 \
            --exclude libcublasLt.so.12 \
            --exclude libcufft.so.11 \
            --exclude libcusparse.so.12 \
            --exclude libcusolver.so.11 \
            --exclude libcurand.so.10 \
            --exclude libcudnn.so.8
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      # the vc++ redistributable does not ship the libomp140.x86_64.dll /openmp:llvm needs
      - name: Cache libomp
        if: runner.os == 'Windows'
        id: libomp-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: libomp
          key: libomp-${{ env.LLVM_VERSION }}

      - name: Download LLVM OpenMP runtime
        if: runner.os == 'Windows' && steps.libomp-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir libomp
          tar -xJf llvm.tar.xz -C libomp --strip-components=2 "clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc/bin/libomp.dll"
          curl -fsSL -o libomp/libomp140.x86_64.LICENSE.txt "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-$LLVM_VERSION/openmp/LICENSE.TXT"
          rm llvm.tar.xz

      - name: Repair Windows wheel
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uvx wheel unpack dist/*.whl -d unpacked
          # a glob naming a not-yet-existing file doesn't expand
          wheel_dir=$(echo unpacked/partuv-*)
          cp libomp/libomp.dll "$wheel_dir/partuv/.libs/libomp140.x86_64.dll"
          cp libomp/libomp140.x86_64.LICENSE.txt "$wheel_dir/partuv/.libs/"
          rm dist/*.whl
          uvx wheel pack "$wheel_dir" -d dist

      # visual studio puts libomp140 in system32, hiding a missing bundled copy
      - name: Remove system libomp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = "C:\Windows\System32\libomp140.x86_64.dll"
          if (Test-Path $dll) {
            takeown /f $dll
            icacls $dll /grant "Administrators:F"
            Remove-Item $dll -Force
          }

      # import loads _core and everything it links
      - name: Test wheel import
        shell: bash
        run: |
          uv venv smoke --python ${{ matrix.python }}
          if [ "$RUNNER_OS" = "Windows" ]; then py=smoke/Scripts/python.exe; else py=smoke/bin/python; fi
          uv pip install --python "$py" dist/*.whl
          "$py" -c "import partuv; print('partuv import ok')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: partuv-wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  upload:
    needs: [prepare, build]
    if: needs.prepare.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: partuv-wheel-*
          merge-multiple: true
          path: dist

      # the addon install operator finds these by python tag and platform
      - name: Publish wheels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version' engine/partuv/pyproject.toml | sed -E 's/version *= *"(.*)"/\1/')
          TAG="partuv-v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --latest=false --title "$TAG" --notes "PartUV engine wheels"
          gh release upload "$TAG" dist/*.whl --clobber
