name: Check partuv version sync

# install.py has its own copy of the partuv version
on:
  pull_request:
    paths:
      - engine/partuv/pyproject.toml
      - src/engines/partuv/install.py
  push:
    branches:
      - master
    paths:
      - engine/partuv/pyproject.toml
      - src/engines/partuv/install.py

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Compare partuv versions
        shell: bash
        run: |
          pyproject=$(grep -m1 '^version' engine/partuv/pyproject.toml | sed -E 's/version *= *"(.*)"/\1/')
          install=$(grep -m1 '^PARTUV_VERSION' src/engines/partuv/install.py | sed -E 's/PARTUV_VERSION *= *"(.*)"/\1/')
          echo "pyproject.toml: $pyproject"
          echo "install.py:     $install"
          if [ "$pyproject" != "$install" ]; then
            echo "::error::PARTUV_VERSION ($install) != pyproject version ($pyproject). Update src/engines/partuv/install.py to match."
            exit 1
          fi
          minimum=$(grep -m1 '^PARTUV_MINIMUM_VERSION' src/engines/partuv/install.py | cut -d'"' -f2)
          if [ -z "$minimum" ]; then
            echo "::error::src/engines/partuv/install.py has no PARTUV_MINIMUM_VERSION line."
            exit 1
          fi
          older=$( { echo "$minimum"; echo "$install"; } | sort -V | head -1 )
          if [ "$older" != "$minimum" ]; then
            echo "::error::PARTUV_MINIMUM_VERSION ($minimum) is newer than PARTUV_VERSION ($install), so every download would be refused."
            exit 1
          fi
