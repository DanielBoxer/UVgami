name: Release check

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  smoke:
    strategy:
      fail-fast: false
      matrix:
        engine: [optcuts, xatlas]
        platform:
          - os: ubuntu-latest
            pkg_name: linux
          - os: windows-latest
            pkg_name: windows
          - os: macos-26-intel
            pkg_name: macos-x64
          - os: macos-26
            pkg_name: macos-arm64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 10
    env:
      ENGINE: ${{ matrix.engine }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # uv refuses macos (tool.uv.environments), and the cli has no dependencies
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download the published zip
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(tr -d '[:space:]' < engine/$ENGINE/VERSION)
          gh release download "$ENGINE-v$VERSION" --pattern "$ENGINE-engine-*-${{ matrix.platform.pkg_name }}.zip" --dir package

      # same basename match as fetch_binary in the addon
      - name: Extract the engine binary
        shell: bash
        run: |
          BINARY=$ENGINE
          if [ "$RUNNER_OS" = "Windows" ]; then BINARY=$ENGINE.exe; fi
          unzip -q package/*.zip -d extracted
          FOUND=$(find extracted -type f -name "$BINARY")
          if [ "$(echo "$FOUND" | grep -c .)" != "1" ]; then
            echo "::error::expected one $BINARY in the zip, found: $FOUND"
            exit 1
          fi
          mkdir -p engine-builds/${{ matrix.platform.pkg_name }}
          cp "$FOUND" engine-builds/${{ matrix.platform.pkg_name }}/
          chmod +x engine-builds/${{ matrix.platform.pkg_name }}/$BINARY

      - name: Unwrap a cube
        shell: bash
        env:
          PYTHONPATH: dev
        run: |
          OUTPUT=$RUNNER_TEMP/cube_uv.obj
          EXTRA=""
          if [ "$ENGINE" = "optcuts" ]; then EXTRA="--timeout 120"; fi
          python -m uvgami_cli unwrap dev/tests/fixtures/cube.obj --engine $ENGINE -o "$OUTPUT" $EXTRA
          grep -q '^vt ' "$OUTPUT"

  # the venv pytest above never imports bpy
  blender:
    strategy:
      fail-fast: false
      matrix:
        blender:
          - release: "4.3"
            version: 4.3.2
          - release: "5.2"
            version: 5.2.0
        platform:
          - os: ubuntu-latest
            arch: linux-x64
            archive: tar.xz
            tag: linux
            binary: blender
          - os: windows-latest
            arch: windows-x64
            archive: zip
            tag: windows
            binary: blender.exe
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      BLENDER_DIR: blender-${{ matrix.blender.version }}-${{ matrix.platform.arch }}
      TAG: ${{ matrix.platform.tag }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync

      - name: Cache blender
        id: blender-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BLENDER_DIR }}
          key: ${{ env.BLENDER_DIR }}

      - name: Download blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        env:
          URL: https://download.blender.org/release/Blender${{ matrix.blender.release }}/${{ env.BLENDER_DIR }}.${{ matrix.platform.archive }}
        run: |
          if [ "${{ matrix.platform.archive }}" = "zip" ]; then
            curl -sSL -o blender.zip "$URL"
            unzip -q blender.zip
          else
            curl -sSL "$URL" | tar xJ
          fi

      # same zips and basename match as fetch_binary in the addon
      - name: Download the engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXE: ${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }}
        run: |
          mkdir -p engine-builds/$TAG
          for ENGINE in optcuts xatlas; do
            VERSION=$(tr -d '[:space:]' < engine/$ENGINE/VERSION)
            gh release download "$ENGINE-v$VERSION" --pattern "$ENGINE-engine-*-$TAG.zip" --dir package/$ENGINE
            mkdir -p extracted/$ENGINE
            unzip -q package/$ENGINE/*.zip -d extracted/$ENGINE
            cp "$(find extracted/$ENGINE -type f -name "$ENGINE$EXE")" engine-builds/$TAG/
            chmod +x "engine-builds/$TAG/$ENGINE$EXE"
          done

      - name: Run the suite inside blender
        env:
          BLENDER: ${{ github.workspace }}/${{ env.BLENDER_DIR }}/${{ matrix.platform.binary }}
        run: uv run python dev/tests/blender/run.py

  partuv:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pattern: "*manylinux*.whl"
          - os: windows-latest
            pattern: "*win_amd64.whl"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # the wheels are cp311 only
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the published wheel
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version' engine/partuv/pyproject.toml | sed -E 's/version *= *"(.*)"/\1/')
          gh release download "partuv-v$VERSION" --pattern "${{ matrix.pattern }}" --dir package
          python -m pip install package/*.whl

      # ai segmentation needs a gpu and the runners have none
      - name: Unwrap a cube
        shell: bash
        env:
          PYTHONPATH: dev
        run: |
          OUTPUT=$RUNNER_TEMP/cube_uv.obj
          python -m uvgami_cli unwrap dev/tests/fixtures/cube.obj \
            --engine partuv --segmentation geometric -o "$OUTPUT"
          grep -q '^vt ' "$OUTPUT"
