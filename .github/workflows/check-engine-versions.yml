name: Check engine version sync

# the addon pins each engine version for its release download url
on:
  pull_request:
    paths:
      - engine/optcuts/VERSION
      - engine/xatlas/VERSION
      - src/engines/optcuts/install.py
      - src/engines/xatlas/install.py
  push:
    branches:
      - master
    paths:
      - engine/optcuts/VERSION
      - engine/xatlas/VERSION
      - src/engines/optcuts/install.py
      - src/engines/xatlas/install.py

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - engine: optcuts
            constant: OPTCUTS_VERSION
            file: src/engines/optcuts/install.py
          - engine: xatlas
            constant: XATLAS_VERSION
            file: src/engines/xatlas/install.py
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Compare ${{ matrix.engine }} versions
        shell: bash
        env:
          ENGINE: ${{ matrix.engine }}
          CONSTANT: ${{ matrix.constant }}
          FILE: ${{ matrix.file }}
        run: |
          engine=$(tr -d '[:space:]' < engine/$ENGINE/VERSION)
          addon=$(grep -m1 "^$CONSTANT" "$FILE" | sed -E 's/.*"(.*)"/\1/')
          echo "VERSION: $engine"
          echo "$FILE: $addon"
          if [ "$engine" != "$addon" ]; then
            echo "::error::$CONSTANT ($addon) != engine version ($engine). Update $FILE to match."
            exit 1
          fi
          minimum=$(grep -m1 "^${CONSTANT%_VERSION}_MINIMUM_VERSION" "$FILE" | cut -d'"' -f2)
          if [ -z "$minimum" ]; then
            echo "::error::$FILE has no ${CONSTANT%_VERSION}_MINIMUM_VERSION line."
            exit 1
          fi
          older=$( { echo "$minimum"; echo "$addon"; } | sort -V | head -1 )
          if [ "$older" != "$minimum" ]; then
            echo "::error::${CONSTANT%_VERSION}_MINIMUM_VERSION ($minimum) is newer than $CONSTANT ($addon), so every download would be refused."
            exit 1
          fi
